name: Reset demo
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake backend and reset demo
        env:
          API_URL: ${{ secrets.API_URL }}
          RESET_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$RESET_TOKEN" ]; then
            echo 'Configure API_URL and DEMO_RESET_TOKEN repository secrets first.'
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 90 \
            --request POST --header "X-Demo-Reset-Token: $RESET_TOKEN" "${API_URL%/}/demo/reset"
